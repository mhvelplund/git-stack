[tools]
"github:Azure/azure-cli" = "latest"
"go:github.com/mhvelplund/git-stack/cmd/git-stack-ado" = "1.0.1"
"go:github.com/mhvelplund/git-stack/cmd/git-stack-bitbucket" = "1.0.1"
"go:github.com/mhvelplund/git-stack/cmd/git-stack-github" = "1.0.1"
"go:github.com/mhvelplund/git-stack/cmd/git-stack-gitlab" = "1.0.1"
"go:github.com/mhvelplund/git-stack/cmd/git-stack" = "1.0.1"
gh = "latest"
glab = "latest"
go = "1.26"
golangci-lint = "2"
pre-commit = "4"
"pipx:commitizen" = "4"

[vars]
ldflags = "-X=github.com/mhvelplund/git-stack/internal/cli.Version={{exec(command='git describe --tags --always --dirty')}}"

[hooks]
# Install the git hooks from .pre-commit-config.yaml whenever tools are installed.
postinstall = "pre-commit install"

[tasks.build]
description = "Build git-stack and the provider plugins into bin/"
run = "go build -ldflags={{vars.ldflags}} -o bin/ ./cmd/..."

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.lint]
description = "Run go vet and golangci-lint"
run = ["go vet ./...", "golangci-lint run ./..."]

[tasks.check]
description = "Build, lint and test"
depends = ["build", "lint", "test"]

[tasks.dist]
description = "Cross-compile all binaries for Windows, Linux and macOS into dist/ as <name>-<os>-<arch>"
run = "go run ./scripts/dist {{vars.ldflags}}"
